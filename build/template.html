<title>Midterm Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one column on a blueprint graph-paper ground with chunky arcade buttons.
   Gym = streak, today, next exam, course cards. Course = stats + topic map. Run = HUD, card, fixed action bar. */
:root {
  --bg: #eef3f8; --grid: rgba(20, 33, 61, .06); --surface: #ffffff; --surface-2: #f4f7fb;
  --ink: #14213d; --muted: #566783; --rule: #cdd8e6;
  --brand: #2f5bea; --brand-deep: #1f3fb0; --brand-ink: #ffffff; --brand-soft: #e2e9fd;
  --gold: #b27800; --gold-soft: #fff1be;
  --good: #12805c; --good-deep: #0b5a41; --good-soft: #dcf4ea;
  --bad: #c42a49; --bad-soft: #fde2e8; --flame: #e8590c;
  --c1: #2f5bea; --c2: #0f8a6a; --c3: #c2410c; --c4: #8b3fd1; --c5: #c42a6b;
  --wax: #fbf2de; --wax-edge: #d8c091;
  --tk-k: #1f3fb0; --tk-s: #0b6b4c; --tk-n: #a43f00; --tk-p: #7a3fb5; --tk-c: #6b7a92;
  --font-display: "Unbounded", "Figtree", system-ui, sans-serif;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1626; --grid: rgba(255, 255, 255, .05); --surface: #12233a; --surface-2: #0e1d31;
    --ink: #e8f0fb; --muted: #93a7c4; --rule: #28435f;
    --brand: #7b98ff; --brand-deep: #4c68d6; --brand-ink: #0a1626; --brand-soft: #1b315f;
    --gold: #ffd23f; --gold-soft: #3b3310;
    --good: #4fd1a1; --good-deep: #2a9a73; --good-soft: #0f3a2e;
    --bad: #ff7390; --bad-soft: #45192b; --flame: #ff8a3d;
    --c1: #7b98ff; --c2: #4fd1a1; --c3: #ff9a5c; --c4: #c39bff; --c5: #ff7fb0;
    --wax: #efe2c4; --wax-edge: #b89f6c;
    --tk-k: #9db2ff; --tk-s: #6fe0b5; --tk-n: #ffb27a; --tk-p: #d3b0ff; --tk-c: #8396b3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1626; --grid: rgba(255, 255, 255, .05); --surface: #12233a; --surface-2: #0e1d31;
  --ink: #e8f0fb; --muted: #93a7c4; --rule: #28435f;
  --brand: #7b98ff; --brand-deep: #4c68d6; --brand-ink: #0a1626; --brand-soft: #1b315f;
  --gold: #ffd23f; --gold-soft: #3b3310;
  --good: #4fd1a1; --good-deep: #2a9a73; --good-soft: #0f3a2e;
  --bad: #ff7390; --bad-soft: #45192b; --flame: #ff8a3d;
  --c1: #7b98ff; --c2: #4fd1a1; --c3: #ff9a5c; --c4: #c39bff; --c5: #ff7fb0;
  --wax: #efe2c4; --wax-edge: #b89f6c;
  --tk-k: #9db2ff; --tk-s: #6fe0b5; --tk-n: #ffb27a; --tk-p: #d3b0ff; --tk-c: #8396b3;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink); font-family: var(--font-ui); font-size: 1rem; line-height: 1.5;
  padding-inline: 1rem;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.app { max-width: 44rem; margin: 0 auto; padding-block: 1.25rem 7.5rem; min-width: 0; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

.eyebrow { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 .35rem; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.5rem, 6vw, 2.1rem); line-height: 1.1; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 500; font-size: 1rem; margin: 0 0 .7rem; letter-spacing: .01em; }
.sub { color: var(--muted); margin: .3rem 0 0; font-size: .95rem; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  border: 0; border-radius: .7rem; padding: .75rem 1.2rem; cursor: pointer; font-weight: 700;
  background: var(--brand); color: var(--brand-ink); box-shadow: 0 4px 0 var(--brand-deep);
  transition: transform .06s ease, box-shadow .06s ease;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--brand-deep); }
.btn:disabled { background: var(--rule); color: var(--muted); box-shadow: 0 4px 0 var(--muted); opacity: .75; cursor: not-allowed; }
.btn.good { background: var(--good); box-shadow: 0 4px 0 var(--good-deep); color: var(--surface); }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: 0 4px 0 var(--rule); border: 1px solid var(--rule); }
.btn.big { width: 100%; padding: 1rem 1.2rem; font-size: 1.1rem; justify-content: space-between; }
.btn small { font-weight: 600; opacity: .85; font-size: .82rem; }
.link { background: none; border: 0; padding: .4rem .2rem; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: .9rem; }
.back { display: inline-flex; align-items: center; gap: .35rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: .25rem .75rem .25rem .55rem; font-size: .85rem; cursor: pointer; margin-bottom: .9rem; }

.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
.toggles { display: flex; gap: .4rem; flex-wrap: wrap; }
.tgl { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: .25rem .7rem; font-size: .82rem; cursor: pointer; display: inline-flex; align-items: center; gap: .4rem; }
.tgl i { width: .6rem; height: .6rem; border-radius: 50%; background: var(--rule); display: block; }
.tgl[aria-pressed="true"] i { background: var(--good); }
.stats { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: .7rem; margin-top: 1.1rem; }
.stat { background: var(--surface); border: 1px solid var(--rule); border-radius: .8rem; padding: .8rem .9rem; min-width: 0; }
.stat .lab { font-family: var(--font-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lvl { display: flex; align-items: baseline; gap: .6rem; margin-top: .15rem; }
.lvl b { font-family: var(--font-display); font-size: 1.9rem; line-height: 1; color: var(--brand); }
.lvl span { font-weight: 700; font-size: .95rem; min-width: 0; }
.xpbar { height: .55rem; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--rule); margin-top: .6rem; overflow: hidden; }
.xpbar i { display: block; height: 100%; width: 0; background: var(--gold); border-radius: 999px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
.big-n { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.1; margin-top: .25rem; font-variant-numeric: tabular-nums; }
.next-n { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.15; margin-top: .3rem; }
.ring { width: 3.4rem; height: 3.4rem; display: block; margin-top: .1rem; }
.ring circle { fill: none; stroke-width: 6; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--good); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1); }
.goal { display: flex; align-items: center; gap: .6rem; }
.goal b { font-family: var(--font-display); font-size: 1rem; font-variant-numeric: tabular-nums; }
.cta { margin-top: 1rem; display: grid; gap: .7rem; }
.cta2 { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
.cta2.one { grid-template-columns: 1fr; }
.cta2 .btn { flex-direction: column; align-items: flex-start; gap: .1rem; text-align: left; }
.due-note { font-size: .88rem; color: var(--muted); margin: 0; }
section.block { margin-top: 1.7rem; }
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(12.5rem, 1fr)); gap: .7rem; }
.topic { text-align: left; background: var(--surface); border: 1px solid var(--rule); border-radius: .8rem; padding: .75rem .85rem; cursor: pointer; min-width: 0; display: grid; gap: .45rem; transition: border-color .15s, transform .15s; }
.topic:hover { border-color: var(--brand); transform: translateY(-2px); }
.topic .tn { font-weight: 700; line-height: 1.2; }
.topic .row { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
.topic .sec { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); }
.topic .pct { font-family: var(--font-display); font-size: .95rem; font-variant-numeric: tabular-nums; }
.pips { display: flex; flex-wrap: wrap; gap: .22rem; }
.pip { width: .78rem; height: .78rem; border-radius: .2rem; background: var(--surface-2); border: 1px solid var(--rule); }
.pip.p1 { background: var(--bad); border-color: var(--bad); }
.pip.p2 { background: color-mix(in srgb, var(--gold) 35%, var(--surface)); border-color: var(--gold); }
.pip.p3 { background: color-mix(in srgb, var(--gold) 65%, var(--surface)); border-color: var(--gold); }
.pip.p4 { background: var(--gold); border-color: var(--gold); }
.pip.p5 { background: var(--good); border-color: var(--good); }
details.how { margin-top: 1.5rem; background: var(--surface); border: 1px solid var(--rule); border-radius: .8rem; padding: .7rem .9rem; font-size: .93rem; }
details.how summary { cursor: pointer; font-weight: 700; }
details.how ul { margin: .6rem 0 0; padding-left: 1.2rem; display: grid; gap: .3rem; }
.foot { margin-top: 1.2rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem; font-size: .85rem; color: var(--muted); }

/* course cards */
.courses { display: grid; gap: .75rem; }
.course { display: grid; grid-template-columns: .45rem minmax(0, 1fr); width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--rule); border-radius: .9rem; overflow: hidden; cursor: pointer; padding: 0; box-shadow: 0 4px 0 var(--rule); transition: transform .12s, border-color .12s; }
.course:hover { border-color: var(--hue); transform: translateY(-2px); }
.course:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--rule); }
.course .stripe { background: var(--hue); }
.course .cb { padding: .8rem .95rem .85rem; display: grid; gap: .35rem; min-width: 0; }
.course .r1 { display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap; }
.course .code { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
.course .nm { color: var(--muted); font-size: .92rem; line-height: 1.3; }
.course .r3 { display: flex; align-items: center; gap: .6rem; font-size: .84rem; flex-wrap: wrap; }
.course .r3 .lv { white-space: nowrap; }
.mbar { flex: 1 1 6rem; height: .5rem; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--rule); overflow: hidden; min-width: 4rem; }
.mbar i { display: block; height: 100%; background: var(--hue); border-radius: 999px; }
.cd { font-family: var(--font-mono); font-size: .74rem; padding: .1rem .55rem; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--rule); white-space: nowrap; }
.cd.soon { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.cd.past { opacity: .7; }
.badge { font-family: var(--font-mono); font-size: .72rem; padding: .05rem .45rem; border-radius: .35rem; background: var(--gold-soft); color: var(--ink); white-space: nowrap; }
.badge.sb { background: var(--brand-soft); color: var(--brand); }
.hue-chip { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; background: var(--hue); margin-right: .4rem; vertical-align: .05em; }

/* run HUD */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; gap: .7rem; padding-block: .6rem; background: var(--bg); }
.x { flex: none; border: 1px solid var(--rule); background: var(--surface); border-radius: .6rem; padding: .3rem .6rem; cursor: pointer; font-size: .85rem; white-space: nowrap; }
.prog { flex: 1; height: .8rem; border-radius: 999px; background: var(--surface); border: 1px solid var(--rule); overflow: hidden; min-width: 3rem; }
.prog i { display: block; height: 100%; background: var(--good); border-radius: 999px; width: 0; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.chip { flex: none; display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); padding: .2rem .6rem; font-family: var(--font-mono); font-size: .8rem; font-variant-numeric: tabular-nums; }
.chip.hot { border-color: var(--flame); color: var(--flame); }
.chip svg { width: .9rem; height: .9rem; }
.chip.hot svg { animation: flick .6s ease-in-out infinite alternate; }
@keyframes flick { from { transform: scale(1) rotate(-4deg); } to { transform: scale(1.18) rotate(4deg); } }
.stage { margin-top: .4rem; position: relative; }

/* question card */
.qcard { background: var(--surface); border: 1px solid var(--rule); border-radius: 1rem; padding: 1.1rem 1.1rem 1.2rem; box-shadow: 0 10px 30px -18px rgba(20, 33, 61, .45); animation: enter .28s ease-out; position: relative; min-width: 0; }
@keyframes enter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.qmeta { display: flex; align-items: center; gap: .55rem; font-size: .82rem; color: var(--muted); margin-bottom: .7rem; flex-wrap: wrap; }
.tag { font-family: var(--font-mono); background: var(--brand-soft); color: var(--brand); border-radius: .35rem; padding: .05rem .45rem; font-size: .75rem; }
.qtext { font-family: var(--font-math); font-size: 1.18rem; line-height: 1.9; min-width: 0; }
.opts { display: grid; gap: .55rem; margin-top: .9rem; }
.opts.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { display: flex; gap: .7rem; align-items: flex-start; text-align: left; width: 100%; min-width: 0; background: var(--surface); border: 2px solid var(--rule); border-radius: .75rem; padding: .6rem .8rem; cursor: pointer; font-family: var(--font-math); font-size: 1.1rem; line-height: 1.8; box-shadow: 0 3px 0 var(--rule); transition: transform .06s, border-color .12s; }
.opts.g2 .opt { flex-direction: column; gap: .2rem; padding: .45rem .5rem .5rem; }
.opt:hover:not(:disabled) { border-color: var(--brand); }
.opt:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--rule); }
.opt:disabled { cursor: default; color: var(--ink); }
.opt .ltr { flex: none; font-family: var(--font-mono); font-size: .8rem; width: 1.5rem; height: 1.5rem; border-radius: .4rem; border: 1px solid var(--rule); display: grid; place-items: center; margin-top: .25rem; color: var(--muted); }
.opts.g2 .opt .ltr { margin-top: 0; }
.opt .otxt { min-width: 0; overflow-wrap: anywhere; width: 100%; }
.opt.sel { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 3px 0 var(--brand); }
.opt.right { border-color: var(--good); background: var(--good-soft); box-shadow: 0 3px 0 var(--good); }
.opt.right .ltr { background: var(--good); border-color: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 3px 0 var(--bad); }
.opt.wrong .ltr { background: var(--bad); border-color: var(--bad); color: var(--surface); }

.part { margin-top: 1rem; padding-top: .9rem; border-top: 1px dashed var(--rule); }
.qtext + .part { border-top: 0; padding-top: 0; margin-top: .6rem; }
.pask { font-family: var(--font-math); font-size: 1.1rem; line-height: 1.8; margin-bottom: .5rem; }
.inrow { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.grid { display: inline-grid; gap: .35rem; align-items: center; max-width: 100%; }
.grid.m { grid-template-columns: repeat(var(--cols), minmax(0, 4.6rem)); padding: .5rem .8rem; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); border-radius: .35rem; }
.grid.v { grid-template-columns: auto minmax(0, 6rem); }
.grid.v .lbl { font-family: var(--font-math); font-style: italic; text-align: right; padding-right: .2rem; }
.grid.s { grid-template-columns: minmax(0, 11rem); }
.grid.w { grid-template-columns: minmax(0, 22rem); width: 100%; }
.cell { width: 100%; font-family: var(--font-mono); font-size: 1rem; padding: .45rem .5rem; border: 2px solid var(--rule); border-radius: .5rem; background: var(--surface-2); color: var(--ink); text-align: center; }
.grid.w .cell { text-align: left; }
.cell:focus { border-color: var(--brand); background: var(--surface); }
.cell.ok { border-color: var(--good); background: var(--good-soft); }
.cell.half { border-color: var(--gold); background: var(--gold-soft); }
.cell.no { border-color: var(--bad); background: var(--bad-soft); }
.unit { font-family: var(--font-math); font-size: 1.05rem; color: var(--muted); }
.fmt-hint { font-size: .8rem; color: var(--muted); margin-top: .35rem; }
.hint-btn { margin-top: .4rem; }
.hint-box { margin-top: .4rem; font-size: .93rem; background: var(--gold-soft); border-radius: .5rem; padding: .4rem .7rem; }

.fb { margin-top: .9rem; border-radius: .7rem; padding: .7rem .9rem; font-family: var(--font-math); font-size: 1.05rem; line-height: 1.8; animation: enter .25s ease-out; min-width: 0; }
.fb.good { background: var(--good-soft); border: 1px solid var(--good); }
.fb.bad { background: var(--bad-soft); border: 1px solid var(--bad); }
.fb.part { background: var(--gold-soft); border: 1px solid var(--gold); }
.fb .hd { font-family: var(--font-ui); font-weight: 700; display: block; margin-bottom: .1rem; }
.fb.good .hd { color: var(--good); }
.fb.bad .hd { color: var(--bad); }
.fb .ans { display: block; margin: .15rem 0; }
.fb .ans-lab { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* code */
pre.code { margin: .55rem 0 .2rem; font-family: var(--font-mono); font-size: .84rem; line-height: 1.55; background: var(--surface-2); color: var(--ink); border: 1px solid var(--rule); border-radius: .6rem; padding: .6rem .8rem; overflow-x: auto; white-space: pre; tab-size: 4; max-width: 100%; }
code.ic { font-family: var(--font-mono); font-size: .86em; background: var(--surface-2); border: 1px solid var(--rule); border-radius: .3rem; padding: 0 .28rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.opt code.ic { background: transparent; border: 0; padding: 0; }
.tk-k { color: var(--tk-k); font-weight: 600; }
.tk-s { color: var(--tk-s); }
.tk-n { color: var(--tk-n); }
.tk-p { color: var(--tk-p); }
.tk-c { color: var(--tk-c); font-style: italic; }
.out { font-family: var(--font-mono); font-size: .92rem; background: var(--surface); border: 1px solid var(--rule); border-radius: .35rem; padding: .05rem .4rem; white-space: pre-wrap; }

/* proofs and ordering */
.pf { display: grid; gap: .5rem; margin-top: .8rem; }
.pf-lab { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: .8rem; }
.tiles { display: grid; gap: .45rem; }
.tile { text-align: left; background: var(--surface); border: 2px solid var(--rule); box-shadow: 0 3px 0 var(--rule); border-radius: .65rem; padding: .45rem .7rem; font-family: var(--font-math); font-size: 1.05rem; line-height: 1.8; cursor: pointer; min-width: 0; }
.tile:hover:not(:disabled) { border-color: var(--brand); }
.tile:disabled { cursor: default; color: var(--ink); }
.tile .tt { display: block; min-width: 0; overflow-wrap: anywhere; }
.tile.code .tt { font-family: var(--font-mono); font-size: .82rem; line-height: 1.55; white-space: pre; overflow-x: auto; overflow-wrap: normal; }
.build { min-height: 3.2rem; border: 2px dashed var(--rule); border-radius: .8rem; padding: .5rem; display: grid; gap: .45rem; counter-reset: s; }
.build .empty { color: var(--muted); font-size: .9rem; padding: .4rem; }
.build .tile { counter-increment: s; display: grid; grid-template-columns: 1.4rem minmax(0, 1fr); gap: .4rem; background: var(--brand-soft); border-color: var(--brand); box-shadow: 0 3px 0 var(--brand); }
.build .tile::before { content: counter(s); font-family: var(--font-mono); font-size: .8rem; color: var(--brand); padding-top: .3rem; }
.build .tile.ok { background: var(--good-soft); border-color: var(--good); box-shadow: 0 3px 0 var(--good); }

.aid .dn { width: calc(100% - 1rem); margin: .5rem; font-size: .84rem; border-collapse: collapse; }
.aid .dn th, .aid .dn td { padding: .15rem .35rem; text-align: left; border-bottom: 1px solid var(--rule); }

.aid { font-size: .88rem; line-height: 1.45; }

/* docked formula sheet: bottom sheet on phones, side panel on wide screens */

  .dock { left: 0; right: 0; bottom: var(--barh, 0px); height: 46vh; height: 46dvh; border-radius: 1rem 1rem 0 0; border-bottom: 0; box-shadow: 0 -10px 30px rgba(8, 16, 30, .2); }
